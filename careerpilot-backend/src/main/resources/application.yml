spring:
  application:
    name: careerpilot
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:careerpilot}
    username: ${DB_USER:careerpilot}
    password: ${DB_PASSWORD:careerpilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET:a-very-long-and-secure-secret-key-for-development-only-change-in-prod}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-expiration-ms: 604800000 # 7 days

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

openai:
  api-key: ${OPENAI_API_KEY:}

adzuna:
  app-id: ${ADZUNA_APP_ID:}
  app-key: ${ADZUNA_APP_KEY:}

r2:
  access-key: ${R2_ACCESS_KEY:dummy-access-key}
  secret-key: ${R2_SECRET_KEY:dummy-secret-key}
  endpoint: ${R2_ENDPOINT:https://dummy.endpoint}
  bucket-name: ${R2_BUCKET_NAME:dummy-bucket}
