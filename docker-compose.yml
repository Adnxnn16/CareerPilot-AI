version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: careerpilot-postgres
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot
      POSTGRES_DB: careerpilot
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: careerpilot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres-data:
