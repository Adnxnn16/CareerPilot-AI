<body class="h-full flex items-center justify-center p-4">
<div class="w-full max-w-[440px] bg-surface-primary border border-border-subtle rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] overflow-hidden flex flex-col">
<div class="px-8 pt-10 pb-8 text-center flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-4xl mb-4" data-weight="fill" style="font-variation-settings: 'FILL' 1;">psychology</span>
<h1 class="font-headline-md text-headline-md text-on-surface">CareerPilot AI</h1>
<p class="font-body-md text-body-md text-text-muted mt-2">The Calm Mentor</p>
</div>
<div class="px-8 pb-10">
<!-- Error State Example -->
<div class="bg-error-container border border-error/20 rounded-lg p-3 mb-6 flex items-start gap-3">
<span class="material-symbols-outlined text-error mt-0.5" style="font-size: 20px;">error</span>
<p class="font-label-sm text-label-sm text-on-error-container">Invalid email or password. Please try again.</p>
</div>
<form class="space-y-6">
<div class="space-y-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="email">Email</label>
<input class="w-full bg-surface-primary border border-border-subtle rounded-md px-3 py-2 font-body-md text-body-md text-on-surface placeholder:text-text-muted focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div class="space-y-1">
<div class="flex items-center justify-between">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-primary border border-border-subtle rounded-md px-3 py-2 font-body-md text-body-md text-on-surface placeholder:text-text-muted focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full bg-[#4F46E5] hover:bg-[#4338CA] text-white font-label-sm text-label-sm py-2.5 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-[#4F46E5] focus:ring-offset-2" type="button">
                    Sign In
                </button>
</form>
<div class="mt-8 pt-6 border-t border-border-subtle text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-medium hover:text-primary-container transition-colors ml-1" href="#">Create an account</a>
</p>
</div>
</div>
